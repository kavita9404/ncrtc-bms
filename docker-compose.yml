# One command: docker compose up --build   ->   http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms
      POSTGRES_DB: bms
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://bms:bms@db:5432/bms
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: [uploads:/srv/uploads]

  # Fake GPS feed. In production this is replaced by the device ingest service.
  tick:
    build: ./backend
    command: ["python", "-m", "app.tick"]
    environment:
      DATABASE_URL: postgresql+psycopg2://bms:bms@db:5432/bms
    depends_on: [api]

  web:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
