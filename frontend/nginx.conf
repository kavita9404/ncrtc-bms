server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 6m;

  location /api/     { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /uploads/ { proxy_pass http://api:8000; }
  location /docs     { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }

  # service worker must never be cached long
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
