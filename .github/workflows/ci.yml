name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bms, POSTGRES_PASSWORD: bms, POSTGRES_DB: bms }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bms" --health-interval 5s --health-retries 10
    env:
      PG_URL: postgresql+psycopg2://bms:bms@localhost:5432/bms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Unit and API tests (SQLite)
        run: pytest -q
      - name: Migrations apply cleanly on PostgreSQL, then seed
        run: |
          DATABASE_URL=$PG_URL alembic upgrade head
          DATABASE_URL=$PG_URL python -m app.seed
      - name: Migrations match the models (no un-migrated changes)
        run: DATABASE_URL=$PG_URL alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
